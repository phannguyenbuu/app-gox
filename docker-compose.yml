# ==============================================================================
# app-gox — React SPA cho remote.goxprint.com
# ==============================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: appgox-nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network
    mem_limit: 128m
    cpus: "0.3"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy-network:
    external: true
